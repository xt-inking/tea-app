version: "2"

linters:
  enable:
    - exhaustive
    - exhaustruct_v5
    - tagalign
    - wrapcheck
  settings:
    exhaustive:
      check:
        - switch
      default-case-required: true
    exhaustruct_v5:
      ignore-patterns:
    tagalign:
      order:
        - json
    wrapcheck:
    errcheck:
      check-blank: true
      exclude-functions:
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/xt-inking/tea)
        - localmodule
      custom-order: true

issues:
  fix: false
